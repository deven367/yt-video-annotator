name: Build and installed application

on: [push, pull_request]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.11'
          activate-environment: true
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv build
      - run: uv pip install dist/*.whl pytest
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Install from source on minimum Python
        run: uv pip install --reinstall --no-deps dist/*.tar.gz
      - name: Smoke source installation
        working-directory: ${{ runner.temp }}
        run: run_app --help
      - name: Install editable on minimum Python
        run: uv pip install --no-deps -e .
      - name: Smoke editable installation
        working-directory: ${{ runner.temp }}
        run: run_app --help && uv pip check
