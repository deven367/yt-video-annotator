name: Build and installed application

on: [push, pull_request]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl pytest
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Install from source on minimum Python
        run: python -m pip install --force-reinstall --no-deps dist/*.tar.gz
      - name: Smoke source installation
        working-directory: ${{ runner.temp }}
        run: run_app --help
      - name: Install editable on minimum Python
        run: python -m pip install --no-deps -e .
      - name: Smoke editable installation
        working-directory: ${{ runner.temp }}
        run: run_app --help && python -m pip check
