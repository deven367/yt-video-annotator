[build-system]
requires = ["setuptools>=84.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotator"
version = "0.0.1"
description = "annotate yt videos on-the-fly"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Deven Mistry", email = "masterdeven@gmail.com"}]
keywords = ["streamlit", "whisper"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pywhispercpp",
    "streamlit",
    "yt-dlp",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/deven367/yt-video-annotator"

[project.scripts]
run_app = "annotator.utils:start_app"

[tool.setuptools.packages.find]
include = ["annotator*"]
